name: Update results.csv

# 23:05 UTC = 00:05 CET in winter / 01:05 CEST in summer.
# GitHub schedules are UTC-only and can start a few minutes late when busy.
on:
  schedule:
    - cron: '5 23 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Crawl Magyar Közlöny listing page 1
        run: ./gradlew run --no-daemon --args="--from=1 --to=1 --out=results.csv --concurrency=4"

      - name: Commit and push if results.csv changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results.csv
          if git diff --staged --quiet; then
            echo "No new issues on page 1."
            exit 0
          fi
          git commit -m "Update results.csv from Magyar Közlöny page 1"
          git push
